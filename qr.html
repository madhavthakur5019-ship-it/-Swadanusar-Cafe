<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e4a3b">
<title>QR codes - Swadanusar Cafe</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --oat:#f6f1e6; --paper:#fffdf8; --ink:#211d1a; --muted:#6d6357; --line:#e2d8bf;
    --green:#15120f; --green-dark:#0a0908; --butter:#c8a24d;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--oat); color:var(--ink); font-family:'Figtree',system-ui,sans-serif;}
  h1,.display{font-family:'Playfair Display','Figtree',system-ui,sans-serif;}
  .controls{padding:16px; background:var(--green); color:var(--oat);}
  .controls h1{color:var(--butter); font-size:22px; margin:0 0 12px;}
  .row{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .row label{font-size:12px; font-weight:700; display:block; margin-bottom:4px;}
  .row input{padding:10px 12px; border-radius:10px; border:1px solid var(--line); font-size:15px; width:100%;}
  .col{flex:1; min-width:160px;}
  .print-btn{background:var(--butter); color:var(--green-dark); border:none; border-radius:999px; padding:10px 20px; font-weight:700; cursor:pointer; min-height:44px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:20px;}
  .qr-card{background:var(--paper); border:2px dashed var(--line); border-radius:16px; padding:18px; text-align:center;}
  .qr-name{font-size:13px; font-weight:600; margin-bottom:6px;}
  .qr-table{font-size:22px; margin:6px 0;}
  .qr-hint{font-size:11px; color:var(--muted); margin-top:6px;}
  .qr-canvas-wrap{display:flex; justify-content:center; margin:8px 0;}
  @media print{
    .controls, .no-print{display:none !important;}
    .grid{padding:0;}
    .qr-card{break-inside:avoid;}
  }
  @media (max-width:420px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="controls">
  <h1>QR codes</h1>
  <div class="row">
    <div class="col">
      <label for="baseUrl">Site link (edit if it changes later)</label>
      <input type="text" id="baseUrl" value="https://swadanusar.github.io/">
    </div>
    <div class="col">
      <label for="tableCount">Number of tables</label>
      <input type="number" id="tableCount" value="10" min="1" max="200">
    </div>
  </div>
  <div class="row no-print">
    <button class="print-btn" id="printBtn">Print</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function generate(){
  const base = document.getElementById("baseUrl").value.trim().replace(/\/?$/, "/");
  const count = Math.max(1, Math.min(200, parseInt(document.getElementById("tableCount").value,10) || 1));
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (let n=1; n<=count; n++){
    const card = document.createElement("div");
    card.className = "qr-card";
    card.innerHTML = `<div class="qr-name">Swadanusar Cafe &amp; Restaurant</div>
      <div class="qr-canvas-wrap" id="qr-${n}"></div>
      <div class="qr-table display">Table ${n}</div>
      <div class="qr-hint">Scan to order</div>`;
    grid.appendChild(card);
    new QRCode(document.getElementById(`qr-${n}`), {
      text: base + "?table=" + n,
      width: 140,
      height: 140,
      colorDark: "#1e4a3b",
      colorLight: "#fffaf1"
    });
  }
}
document.getElementById("baseUrl").addEventListener("change", generate);
document.getElementById("tableCount").addEventListener("change", generate);
document.getElementById("printBtn").addEventListener("click", ()=> window.print());
generate();
</script>
</body>
</html>
